name: Thesis bibliography package

on:
  push:
    branches: [main]
    paths:
      - "κατάλογος/πηγές.csv"
      - "catalog/sources.csv"
      - "αναλύσεις/**"
      - "analyses/**"
      - "αποσπάσματα/**"
      - "evidence/**"
      - "κατάλογος/επιλογή-διπλωματικής.csv"
      - "catalog/thesis-selection.csv"
      - "εργαλεία/κατάσταση_απόφασης.py"
      - "tools/decision_status.py"
      - "εργαλεία/language_audit.py"
      - "tools/language_audit.py"
      - "εργαλεία/συγχρονισμός-επιλογής.py"
      - "tools/sync_selection.py"
      - "εργαλεία/κατάσταση-αναλύσεων.py"
      - "tools/analysis_status.py"
      - "εργαλεία/εξαγωγή-διπλωματικής.py"
      - "tools/export_thesis.py"
      - "εργαλεία/migrate_repository_paths.py"
      - "tools/migrate_repository_paths.py"
      - ".github/workflows/πακέτο-διπλωματικής.yml"
      - ".github/workflows/thesis-package.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the path-migration workflow so generated-file writes and bulk renames
# cannot race each other on main.
concurrency:
  group: bibliography-generated-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migrate legacy paths transactionally when needed
        id: migrate
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import subprocess, sys
          paths = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          residual = [p for p in paths if any(ord(ch) > 127 for ch in p)]
          print(f"Pre-migration non-ASCII tracked paths: {len(residual)}")
          raise SystemExit(0 if residual else 1)
          PY
          needed=$?

          if [ "$needed" -ne 0 ]; then
            echo "migrated=false" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f tools/migrate_repository_paths.py ]; then
            python tools/migrate_repository_paths.py > /tmp/path-migration.log 2>&1
          else
            python εργαλεία/migrate_repository_paths.py > /tmp/path-migration.log 2>&1
          fi
          code=$?

          if [ "$code" -eq 0 ]; then
            python - <<'PY' >> /tmp/path-migration.log 2>&1
          import subprocess
          paths = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          residual = [p for p in paths if any(ord(ch) > 127 for ch in p)]
          print(f"Residual non-ASCII tracked paths: {len(residual)}")
          for path in residual:
              print(path)
          raise SystemExit(1 if residual else 0)
          PY
            code=$?
          fi

          if [ "$code" -eq 0 ]; then
            python -m py_compile \
              tools/decision_status.py \
              tools/language_audit.py \
              tools/sync_selection.py \
              tools/analysis_status.py \
              tools/export_thesis.py >> /tmp/path-migration.log 2>&1
            code=$?
          fi

          if [ "$code" -eq 0 ]; then
            python -m unittest \
              tests.test_decision_status \
              tests.test_thesis_export \
              tests.test_theory_only_export \
              tests.test_aggregates \
              -v >> /tmp/path-migration.log 2>&1
            code=$?
          fi

          cat /tmp/path-migration.log
          if [ "$code" -ne 0 ]; then
            git reset --hard HEAD
            {
              echo "# Path migration failure"
              echo
              echo '```text'
              cat /tmp/path-migration.log
              echo '```'
            } > PATH_MIGRATION_FAILURE.md
            echo "migrated=false" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            rm -f PATH_MIGRATION_FAILURE.md
            echo "migrated=true" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Commit migration or diagnostic
        if: steps.migrate.outputs.migrated == 'true' || steps.migrate.outputs.failed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes."
            exit 0
          fi
          if [ "${{ steps.migrate.outputs.failed }}" = "true" ]; then
            git commit -m "chore: record English path migration failure [skip ci]"
          else
            git commit -m "chore: migrate repository paths to English"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Stop this run after migration
        if: steps.migrate.outputs.migrated == 'true' || steps.migrate.outputs.failed == 'true'
        run: echo "Migration stage completed; package generation is deferred to the next English-path run."

      - name: Compile package tools
        if: steps.migrate.outputs.migrated == 'false' && steps.migrate.outputs.failed == 'false'
        run: >-
          python -m py_compile
          tools/decision_status.py
          tools/language_audit.py
          tools/sync_selection.py
          tools/analysis_status.py
          tools/export_thesis.py

      - name: Sync canonical registry
        if: steps.migrate.outputs.migrated == 'false' && steps.migrate.outputs.failed == 'false'
        run: |
          python tools/sync_selection.py
          python tools/analysis_status.py

      - name: Commit registry and authoritative status
        if: steps.migrate.outputs.migrated == 'false' && steps.migrate.outputs.failed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/thesis-selection.csv catalog/analysis-status.csv catalog/analysis-status.md
          if git diff --cached --quiet; then
            echo "Registry and status are already current."
          else
            git commit -m "chore: sync canonical registry and status [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build verified thesis package
        if: steps.migrate.outputs.migrated == 'false' && steps.migrate.outputs.failed == 'false'
        run: python tools/export_thesis.py

      - name: Commit thesis package
        if: steps.migrate.outputs.migrated == 'false' && steps.migrate.outputs.failed == 'false'
        run: |
          if [ -z "$(git status --porcelain thesis-package)" ]; then
            echo "The thesis package is already current."
          else
            git add thesis-package
            git commit -m "chore: update verified thesis package [skip ci]"
            git push origin HEAD:main
          fi
