name: Πακέτο διπλωματικής

on:
  push:
    branches: [main]
    paths:
      - "κατάλογος/πηγές.csv"
      - "αναλύσεις/**"
      - "αποσπάσματα/**"
      - "κατάλογος/επιλογή-διπλωματικής.csv"
      - "εργαλεία/κατάσταση-αναλύσεων.py"
      - "εργαλεία/εξαγωγή-διπλωματικής.py"
      - ".github/workflows/πακέτο-διπλωματικής.yml"
  workflow_dispatch:

permissions:
  contents: write

# Μοιράζεται την ίδια ουρά με τα υπόλοιπα generated αρχεία. Έτσι δύο
# workflows δεν κάνουν push ταυτόχρονα πάνω στο main.
concurrency:
  group: παραγόμενα-αρχεία-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Λήψη του πιο πρόσφατου main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Ρύθμιση Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Έλεγχος σύνταξης
        run: python -m py_compile εργαλεία/κατάσταση-αναλύσεων.py εργαλεία/εξαγωγή-διπλωματικής.py

      - name: Ενημέρωση ουράς αναλύσεων
        run: python εργαλεία/κατάσταση-αναλύσεων.py

      - name: Δημιουργία επαληθευμένου πακέτου
        run: python εργαλεία/εξαγωγή-διπλωματικής.py

      - name: Αποθήκευση παραγόμενων αρχείων
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Το πακέτο είναι ήδη ενημερωμένο."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add κατάλογος/κατάσταση-αναλύσεων.csv κατάλογος/κατάσταση-αναλύσεων.md πακέτο-διπλωματικής
          git commit -m "chore: ενημέρωση επαληθευμένου πακέτου διπλωματικής [skip ci]"
          git push origin HEAD:main
