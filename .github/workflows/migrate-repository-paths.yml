name: Migrate repository paths to English

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-repository-paths.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-repository-paths
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Move tracked infrastructure paths and update references
        run: python εργαλεία/migrate_repository_paths.py

      - name: Best-effort syntax and unit checks after migration
        continue-on-error: true
        run: |
          python -m compileall -q tools || true
          python -m unittest discover -s tests -v || true

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No path migration changes."
            exit 0
          fi
          git commit -m "chore: migrate repository paths to English [skip ci]"
          git push origin HEAD:main
