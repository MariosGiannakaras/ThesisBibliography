name: Migrate repository paths to English

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".path-migration-trigger"

permissions:
  contents: write

# Share the same write lock as generated bibliography/package jobs so that a bulk
# rename cannot race with a generated-file commit.
concurrency:
  group: bibliography-generated-main
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run transactional path migration
        id: migrate
        shell: bash
        run: |
          set +e
          if [ -f tools/migrate_repository_paths.py ]; then
            python tools/migrate_repository_paths.py > /tmp/path-migration.log 2>&1
          else
            python εργαλεία/migrate_repository_paths.py > /tmp/path-migration.log 2>&1
          fi
          code=$?

          if [ "$code" -eq 0 ]; then
            python - <<'PY' >> /tmp/path-migration.log 2>&1
          import subprocess
          paths = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          residual = [p for p in paths if any(ord(ch) > 127 for ch in p)]
          print(f"Residual non-ASCII tracked paths: {len(residual)}")
          for path in residual:
              print(path)
          raise SystemExit(1 if residual else 0)
          PY
            code=$?
          fi

          if [ "$code" -eq 0 ]; then
            python -m py_compile \
              tools/decision_status.py \
              tools/language_audit.py \
              tools/sync_selection.py \
              tools/analysis_status.py \
              tools/export_thesis.py >> /tmp/path-migration.log 2>&1
            code=$?
          fi

          if [ "$code" -eq 0 ]; then
            python -m unittest \
              tests.test_decision_status \
              tests.test_thesis_export \
              tests.test_theory_only_export \
              tests.test_aggregates \
              -v >> /tmp/path-migration.log 2>&1
            code=$?
          fi

          cat /tmp/path-migration.log
          if [ "$code" -ne 0 ]; then
            git reset --hard HEAD
            {
              echo "# Path migration failure"
              echo
              echo '```text'
              cat /tmp/path-migration.log
              echo '```'
            } > PATH_MIGRATION_FAILURE.md
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            rm -f PATH_MIGRATION_FAILURE.md
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Commit migration or diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No path migration changes."
            exit 0
          fi
          if [ "${{ steps.migrate.outputs.failed }}" = "true" ]; then
            git commit -m "chore: record English path migration failure [skip ci]"
          else
            git commit -m "chore: migrate repository paths to English [skip ci]"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
