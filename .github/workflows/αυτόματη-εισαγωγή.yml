name: Αυτόματη εισαγωγή πηγών

on:
  push:
    branches: [main]
    paths:
      - "νέες-πηγές/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: αυτόματη-εισαγωγή
  cancel-in-progress: true

jobs:
  process:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Λήψη αποθετηρίου
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Ρύθμιση Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Προκαταρκτικός έλεγχος εργαλείων διόρθωσης
        run: |
          python -m py_compile εργαλεία/γνωστές-διορθώσεις.py εργαλεία/ακριβή-διπλότυπα.py εργαλεία/καθαρισμός-συνδέσεων.py εργαλεία/πρωτότυπα_κοινά.py

      - name: Εφαρμογή τεκμηριωμένων διορθώσεων
        run: python εργαλεία/γνωστές-διορθώσεις.py

      - name: Συγχώνευση ακριβώς ίδιων PDF
        run: python εργαλεία/ακριβή-διπλότυπα.py

      - name: Ρύθμιση Git LFS
        run: |
          git lfs install --local
          git lfs pull --include="νέες-πηγές/**,νέα-πρωτότυπα/**" --exclude="" || true

      - name: Κανονικοποίηση κατάληξης PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          for root in (Path("νέες-πηγές"), Path("νέα-πρωτότυπα")):
              if not root.exists():
                  continue
              for path in list(root.rglob("*")):
                  if path.is_file() and path.suffix == ".PDF":
                      target = path.with_suffix(".pdf")
                      if not target.exists():
                          path.rename(target)
          PY

      - name: Εγκατάσταση αναγνώστη PDF
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Έλεγχος εργαλείων και δοκιμών
        run: |
          python -m py_compile εργαλεία/εισαγωγή.py εργαλεία/μεταδεδομένα.py εργαλεία/διόρθωση-τίτλων.py εργαλεία/έλεγχος.py εργαλεία/κοινά_πηγών.py εργαλεία/καθαρισμός-συνδέσεων.py εργαλεία/γνωστές-διορθώσεις.py εργαλεία/ακριβή-διπλότυπα.py εργαλεία/πρωτότυπα.py εργαλεία/πρωτότυπα_κοινά.py εργαλεία/πρωτότυπα_λήψεις.py εργαλεία/πρωτότυπα_αρχεία.py
          python -m unittest discover -s tests -v

      - name: Εισαγωγή νέων πηγών
        run: python εργαλεία/εισαγωγή.py

      - name: Ενημέρωση μεταδεδομένων
        id: metadata
        continue-on-error: true
        run: python εργαλεία/μεταδεδομένα.py

      - name: Διόρθωση τίτλων και ετών
        continue-on-error: true
        run: python εργαλεία/διόρθωση-τίτλων.py

      - name: Έλεγχος συνδέσεων και βέβαιων διπλοτύπων
        run: python εργαλεία/καθαρισμός-συνδέσεων.py

      - name: Αντιστοίχιση και πρώτη λήψη πρωτοτύπων
        run: python εργαλεία/πρωτότυπα.py --download --limit 30

      - name: Μεταφορά μη αντιστοιχισμένων PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import sys

          sys.path.insert(0, "εργαλεία")
          from πρωτότυπα_κοινά import LINKED_PDF_STEM_RE

          pending = Path("νέα-πρωτότυπα/εκκρεμή")
          pending.mkdir(parents=True, exist_ok=True)
          for path in [
              item for item in Path("πρωτότυπα").glob("*.pdf")
              if not LINKED_PDF_STEM_RE.fullmatch(item.stem)
          ]:
              target = pending / path.name
              if target.exists():
                  suffix = hashlib.sha256(path.as_posix().encode()).hexdigest()[:8]
                  target = pending / f"{path.stem}__{suffix}.pdf"
              shutil.move(str(path), target)
          PY

      - name: Έλεγχος αποθετηρίου
        run: python εργαλεία/έλεγχος.py

      - name: Αποθήκευση αποτελεσμάτων
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Δεν προέκυψαν αλλαγές."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: αυτόματη εισαγωγή νέων πηγών και πρωτοτύπων [skip ci]"
          git push

      - name: Αναφορά αποτυχίας εξωτερικών υπηρεσιών
        if: steps.metadata.outcome == 'failure'
        run: echo "Η εισαγωγή και η λήψη πρωτοτύπων ολοκληρώθηκαν, αλλά η επιβεβαίωση μεταδεδομένων θα επαναληφθεί."
