name: Update bibliography metadata

on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "originals/**"
      - "tools/metadata.py"
      - "tools/next_sources.py"
      - ".github/workflows/update-metadata.yml"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bibliography-metadata
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh next-source list
        if: ${{ github.event_name == 'push' }}
        run: python tools/next_sources.py

      - name: Run full bibliography enrichment
        if: ${{ github.event_name != 'push' }}
        run: python tools/metadata.py

      - name: Validate repository
        run: python tools/validate.py

      - name: Publish generated metadata review branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- catalog)" ]; then
            echo "No metadata changes."
            exit 0
          fi
          branch="automation/metadata-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add catalog
          git commit -m "chore: update bibliography metadata"
          git push origin "HEAD:$branch"
          if gh pr create --base main --head "$branch" --title "chore: update bibliography metadata" --body "Automated bibliography metadata refresh. Repository validation completed before this PR was opened."; then
            echo "Generated metadata PR created automatically."
          else
            echo "::warning::GitHub Actions is not permitted to create Pull Requests in this repository. The validated branch remains available for review."
            echo "Generated review branch: \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
          fi
