name: Source-language audit

on:
  push:
    branches: [main]
    paths:
      - "πηγές/**"
      - "sources/**"
      - "αποσπάσματα/**"
      - "evidence/**"
      - "κατάλογος/επιλογή-διπλωματικής.csv"
      - "catalog/thesis-selection.csv"
      - "εργαλεία/language_audit.py"
      - "tools/language_audit.py"
      - ".github/workflows/language-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-language-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run non-destructive language audit
        run: |
          if [ -f tools/language_audit.py ]; then
            python tools/language_audit.py
          else
            python εργαλεία/language_audit.py
          fi

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f catalog/language-audit.md ]; then
            git add catalog/language-audit.md
          fi
          if [ -f κατάλογος/language-audit.md ]; then
            git add κατάλογος/language-audit.md
          fi
          if git diff --cached --quiet; then
            echo "Language audit report unchanged."
            exit 0
          fi
          git commit -m "chore: update source-language audit [skip ci]"
          git push origin HEAD:main
