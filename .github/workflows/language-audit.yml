name: Source-language audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".audit-trigger"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-language-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run non-destructive source-language audit
        run: python tools/language_audit.py

      - name: Open language-audit pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add catalog/language-audit.md
          if git diff --cached --quiet; then
            echo "Language audit report unchanged."
            exit 0
          fi
          branch="automation/language-audit-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore: update source-language audit [skip ci]"
          git push origin "HEAD:$branch"
          gh pr create --base main --head "$branch" --title "chore: update source-language audit" --body "Non-destructive audit report refresh. Scientific source and evidence text remains in the checked source language."
