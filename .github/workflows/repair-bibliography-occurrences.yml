name: Repair bibliography occurrence IDs

on:
  push:
    branches:
      - chore/curate-bibliography-corpus

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair occurrence IDs
        run: |
          python -m py_compile scripts/repair_duplicate_occurrence_ids.py
          python scripts/repair_duplicate_occurrence_ids.py

      - name: Remove generated bytecode and add ignore rules
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          .mypy_cache/
          .ruff_cache/
          .DS_Store
          EOF

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair duplicate bibliography occurrence IDs [skip ci]"
          git push
