name: Ενημέρωση μεταδεδομένων

on:
  push:
    branches:
      - main
    paths:
      - "πηγές/**"
      - "πρωτότυπα/**"
      - "εργαλεία/μεταδεδομένα.py"
      - "εργαλεία/επόμενες-πηγές.py"
      - ".github/workflows/ενημέρωση-μεταδεδομένων.yml"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Μοιράζεται την ίδια ουρά με όλα τα workflows που παράγουν και κάνουν
# commit αρχεία στο main, ώστε να αποφεύγονται non-fast-forward pushes.
concurrency:
  group: παραγόμενα-αρχεία-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Λήψη του πιο πρόσφατου main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Ρύθμιση Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Γρήγορη ενημέρωση λίστας επόμενων πηγών
        if: ${{ github.event_name == 'push' }}
        run: python εργαλεία/επόμενες-πηγές.py

      - name: Πλήρες βιβλιογραφικό enrichment
        if: ${{ github.event_name != 'push' }}
        run: python εργαλεία/μεταδεδομένα.py

      - name: Έλεγχος αποθετηρίου
        run: python εργαλεία/έλεγχος.py

      - name: Αποθήκευση αλλαγών
        run: |
          if [ -z "$(git status --porcelain -- κατάλογος)" ]; then
            echo "Δεν προέκυψαν αλλαγές."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add κατάλογος
          if [ "${{ github.event_name }}" = "push" ]; then
            git commit -m "chore: ενημέρωση λίστας προτεινόμενων πηγών"
          else
            git commit -m "chore: ενημέρωση βιβλιογραφικών μεταδεδομένων"
          fi
          git push origin HEAD:main
