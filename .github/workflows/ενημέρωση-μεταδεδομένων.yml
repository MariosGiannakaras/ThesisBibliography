name: Ενημέρωση μεταδεδομένων

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ενημέρωση-μεταδεδομένων
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Λήψη αποθετηρίου
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ρύθμιση Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ενημέρωση μεταδεδομένων και επόμενων πηγών
        run: python εργαλεία/μεταδεδομένα.py

      - name: Έλεγχος αποθετηρίου
        run: python εργαλεία/έλεγχος.py

      - name: Αποθήκευση αλλαγών
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Δεν προέκυψαν αλλαγές."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add κατάλογος
          git commit -m "chore: ενημέρωση βιβλιογραφικών μεταδεδομένων [skip ci]"
          git push
