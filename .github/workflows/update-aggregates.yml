name: Update aggregate bibliography files

on:
  push:
    branches: [main]
    paths:
      - "catalog/sources.csv"
      - "sources/**"
      - "evidence/**"
      - "tools/aggregates.py"
      - ".github/workflows/update-aggregates.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bibliography-aggregates
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate aggregate generator
        run: |
          python -m py_compile tools/aggregates.py
          python -m unittest discover -s tests -p "test_aggregates.py" -v

      - name: Generate aggregate views
        run: python tools/aggregates.py

      - name: Publish generated aggregate review branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- SOURCE_ARCHIVE.md USEFUL_EVIDENCE.md)" ]; then
            echo "Aggregate files are already current."
            exit 0
          fi
          branch="automation/aggregates-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add SOURCE_ARCHIVE.md USEFUL_EVIDENCE.md
          git commit -m "chore: update aggregate bibliography files"
          git push origin "HEAD:$branch"
          if gh pr create --base main --head "$branch" --title "chore: update aggregate bibliography files" --body "Automated regeneration of SOURCE_ARCHIVE.md and USEFUL_EVIDENCE.md after validation."; then
            echo "Generated aggregate PR created automatically."
          else
            echo "::warning::GitHub Actions is not permitted to create Pull Requests in this repository. The validated branch remains available for review."
            echo "Generated review branch: \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
          fi
