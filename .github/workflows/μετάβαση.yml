name: Μετάβαση στην απλή ελληνική δομή

on:
  push:
    branches: [chore/aplopoiisi-ellinika]

permissions:
  contents: write

jobs:
  μετάβαση:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Λήψη κλάδου
        uses: actions/checkout@v4
        with:
          ref: chore/aplopoiisi-ellinika
          fetch-depth: 0

      - name: Ρύθμιση Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Έλεγχος σύνταξης εργαλείων
        run: python -m py_compile εργαλεία/μετάβαση.py εργαλεία/εισαγωγή.py εργαλεία/μεταδεδομένα.py εργαλεία/έλεγχος.py

      - name: Μεταφορά και καθαρισμός παλιάς δομής
        run: python εργαλεία/μετάβαση.py

      - name: Αναδημιουργία απλού καταλόγου
        run: python εργαλεία/εισαγωγή.py

      - name: Τελικός έλεγχος
        run: python εργαλεία/έλεγχος.py

      - name: Αφαίρεση προσωρινού εργαλείου μετάβασης
        run: rm εργαλεία/μετάβαση.py .github/workflows/μετάβαση.yml

      - name: Αποθήκευση νέας δομής
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: απλοποίηση και ελληνική οργάνωση βιβλιογραφίας [skip ci]"
          git push origin HEAD:chore/aplopoiisi-ellinika
