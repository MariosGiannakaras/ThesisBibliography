name: Publish complete research corpus baseline v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integration-baseline-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bibliography-integration-baseline-v3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate complete integration corpus
        run: |
          python tools/package_integrity.py validate thesis-package
          python tools/validate_thesis_package.py
          python tools/research_materials.py validate
          python tools/validate_research_material_review.py
          python tools/export_research_corpus.py validate
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          corpus = json.loads(Path("research-corpus/catalog/package-metadata.json").read_text(encoding="utf-8"))
          citation = json.loads(Path("thesis-package/catalog/package-metadata.json").read_text(encoding="utf-8"))
          expected_corpus = {
              "schema_version": 1,
              "source_count": 585,
              "selected_source_count": 113,
              "research_material_count": 19,
              "original_pdf_count": 281,
              "file_count": 1568,
          }
          expected_citation = {
              "schema_version": 1,
              "selected_sources": 113,
              "file_count": 230,
          }
          for key, value in expected_corpus.items():
              if corpus.get(key) != value:
                  raise SystemExit(f"Unexpected corpus {key}: {corpus.get(key)!r}; expected {value!r}")
          for key, value in expected_citation.items():
              if citation.get(key) != value:
                  raise SystemExit(f"Unexpected citation package {key}: {citation.get(key)!r}; expected {value!r}")

          sha_re = re.compile(r"[0-9a-f]{40}")
          for label, commit in (
              ("research-corpus", corpus.get("source_commit", "")),
              ("thesis-package", citation.get("source_commit", "")),
          ):
              if not sha_re.fullmatch(commit):
                  raise SystemExit(f"{label} source_commit is not a full Git SHA: {commit!r}")
              result = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", commit, "HEAD"],
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit(f"{label} source_commit is not an ancestor of HEAD: {commit}")

          corpus_source = Path("research-corpus/SOURCE_COMMIT").read_text(encoding="utf-8").strip()
          citation_source = Path("thesis-package/SOURCE_COMMIT").read_text(encoding="utf-8").strip()
          if corpus_source != corpus["source_commit"]:
              raise SystemExit("research-corpus metadata/source commit mismatch")
          if citation_source != citation["source_commit"]:
              raise SystemExit("thesis-package metadata/source commit mismatch")
          PY

      - name: Publish immutable integration tag
        shell: bash
        run: |
          set -euo pipefail
          tag="bibliography-integration-v3"
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            existing="$(git rev-list -n 1 "$tag")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already points to $existing, not $GITHUB_SHA"
              exit 1
            fi
            echo "Tag $tag already points to this validated commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Complete bibliography research corpus integration baseline v3"
          git push origin "refs/tags/$tag"
