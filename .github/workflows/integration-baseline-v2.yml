name: Publish complete research corpus baseline v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integration-baseline-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bibliography-integration-baseline-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate complete integration corpus
        run: |
          python tools/package_integrity.py validate thesis-package
          python tools/validate_thesis_package.py
          python tools/research_materials.py validate
          python tools/validate_research_material_review.py
          python tools/export_research_corpus.py validate
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("research-corpus/catalog/package-metadata.json").read_text(encoding="utf-8"))
          expected = {
              "schema_version": 1,
              "source_count": 583,
              "selected_source_count": 112,
              "research_material_count": 19,
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"Unexpected {key}: {metadata.get(key)!r}; expected {value!r}")
          PY

      - name: Publish immutable integration tag
        shell: bash
        run: |
          set -euo pipefail
          tag="bibliography-integration-v2"
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            existing="$(git rev-list -n 1 "$tag")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already points to $existing, not $GITHUB_SHA"
              exit 1
            fi
            echo "Tag $tag already points to this validated commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Complete bibliography research corpus integration baseline v2"
          git push origin "refs/tags/$tag"
