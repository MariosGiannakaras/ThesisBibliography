name: Validate bibliography

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate enriched repository
        run: python scripts/validate_enriched_repository.py
      - name: Verify deterministic regeneration
        run: |
          python scripts/organize_sources.py
          python scripts/enrich_bibliography.py
          git diff --exit-code
