name: Validate bibliography repository

on:
  push:
    branches: [main]
    paths-ignore:
      - "new-sources/**"
      - "new-originals/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Isolate pending intake from structural PR validation
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          for root_name in ("new-sources", "new-originals"):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in list(root.iterdir()):
                  if path.name == "README.md":
                      continue
                  if path.is_dir():
                      shutil.rmtree(path)
                  else:
                      path.unlink()
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Compile repository tools
        run: >-
          python -m py_compile
          tools/intake_preflight.py tools/import_sources.py tools/metadata.py tools/next_sources.py
          tools/fix_titles.py tools/validate.py tools/sources_common.py
          tools/clean_links.py tools/known_fixes.py
          tools/exact_duplicates.py tools/finalize.py tools/originals.py
          tools/originals_common.py tools/originals_downloads.py tools/originals_files.py
          tools/convert_pdf.py tools/decision_status.py
          tools/sync_selection.py tools/analysis_status.py
          tools/export_thesis.py tools/aggregates.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Dry-run documented fixes
        run: python tools/known_fixes.py

      - name: Dry-run exact PDF duplicate merge
        run: python tools/exact_duplicates.py

      - name: Dry-run finalization while preserving useful content
        run: python tools/finalize.py

      - name: Sync thesis selection registry
        run: python tools/sync_selection.py

      - name: Build authoritative analysis queue
        run: python tools/analysis_status.py

      - name: Generate aggregate views
        run: |
          python tools/aggregates.py
          test -s SOURCE_ARCHIVE.md
          test -s USEFUL_EVIDENCE.md

      - name: Validate thesis export registry
        run: |
          python tools/export_thesis.py --validate-only
          python tools/export_thesis.py --output /tmp/thesis-package

      - name: Validate repository structure and catalog
        run: python tools/validate.py
