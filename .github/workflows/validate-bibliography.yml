name: Μετάβαση και έλεγχος βιβλιογραφίας

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  έλεγχος:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Λήψη αποθετηρίου
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Ρύθμιση Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Μετάβαση ή κανονικός έλεγχος
        run: |
          if [ -f εργαλεία/μετάβαση.py ]; then
            python -m py_compile εργαλεία/μετάβαση.py εργαλεία/εισαγωγή.py εργαλεία/μεταδεδομένα.py εργαλεία/έλεγχος.py
            python εργαλεία/μετάβαση.py
            python εργαλεία/εισαγωγή.py
            python εργαλεία/έλεγχος.py

            rm -f εργαλεία/μετάβαση.py
            rm -f .github/workflows/μετάβαση.yml .github/workflows/έλεγχος.yml

            cat > .github/workflows/validate-bibliography.yml <<'YAML'
          name: Έλεγχος αποθετηρίου

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            έλεγχος:
              runs-on: ubuntu-latest
              steps:
                - name: Λήψη αποθετηρίου
                  uses: actions/checkout@v4
                - name: Ρύθμιση Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - name: Έλεγχος σύνταξης
                  run: python -m py_compile εργαλεία/εισαγωγή.py εργαλεία/μεταδεδομένα.py εργαλεία/έλεγχος.py
                - name: Έλεγχος δομής και καταλόγου
                  run: python εργαλεία/έλεγχος.py
          YAML

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "refactor: απλοποίηση και ελληνική οργάνωση βιβλιογραφίας"
            git push origin HEAD:${{ github.head_ref }}
          else
            python -m py_compile εργαλεία/εισαγωγή.py εργαλεία/μεταδεδομένα.py εργαλεία/έλεγχος.py
            python εργαλεία/έλεγχος.py
          fi
