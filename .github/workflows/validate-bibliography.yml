name: Έλεγχος αποθετηρίου

on:
  push:
    branches: [main]
    paths-ignore:
      - "νέες-πηγές/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Λήψη αποθετηρίου
        uses: actions/checkout@v4

      - name: Ρύθμιση Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Έλεγχος σύνταξης
        run: python -m py_compile εργαλεία/εισαγωγή.py εργαλεία/μεταδεδομένα.py εργαλεία/έλεγχος.py

      - name: Έλεγχος δομής και καταλόγου
        run: python εργαλεία/έλεγχος.py
