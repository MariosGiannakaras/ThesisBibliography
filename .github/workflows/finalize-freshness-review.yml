name: Finalize August 2026 freshness scientific review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/freshness-scientific-review-2026-08'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          lfs: false

      - name: Regenerate canonical scientific state
        run: |
          python tools/sync_selection.py
          python tools/analysis_status.py
          python tools/aggregates.py
          python tools/export_thesis.py --validate-only
          python tools/validate.py

      - name: Commit deterministic derived files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No derived changes to commit.'
            exit 0
          fi
          git commit -m 'research: finalize August 2026 freshness review state'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
