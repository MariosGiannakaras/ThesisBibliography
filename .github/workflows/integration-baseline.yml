name: Publish bibliography integration baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integration-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bibliography-integration-baseline-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate committed integration package
        run: |
          python tools/package_integrity.py validate thesis-package
          python tools/validate_thesis_package.py
          python tools/fix_verified_catalog_flags.py

      - name: Publish immutable integration tag
        shell: bash
        run: |
          set -euo pipefail
          tag="bibliography-integration-v1"
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            existing="$(git rev-list -n 1 "$tag")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already points to $existing, not $GITHUB_SHA"
              exit 1
            fi
            echo "Tag $tag already points to this validated commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Verified bibliography integration baseline v1"
          git push origin "refs/tags/$tag"
