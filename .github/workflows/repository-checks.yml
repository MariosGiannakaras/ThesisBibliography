name: Repository checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile maintenance scripts
        run: python -m compileall -q scripts tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate bibliography archive
        run: python scripts/validate_bibliography_repository.py
