name: Normalize Pinto verification label

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/pinto-canonical-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pinto-canonical-metadata
          fetch-depth: 0
          lfs: false

      - name: Use controlled catalog verification value
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('catalog/sources.csv')
          with path.open(encoding='utf-8', newline='') as handle:
              reader = csv.DictReader(handle)
              fields = list(reader.fieldnames or [])
              rows = [dict(row) for row in reader]
          found = False
          for row in rows:
              if row.get('Κωδικός') == 'SRC-1FE2A54527':
                  found = True
                  row['Επιβεβαίωση'] = 'μόνο καταγεγραμμένος σύνδεσμος'
                  note = 'Full-text bibliographic metadata independently verified from the primary PMLR paper; catalog verification field uses the controlled link-level vocabulary.'
                  existing = (row.get('Σημειώσεις') or '').strip()
                  if note not in existing:
                      row['Σημειώσεις'] = (existing + ' | ' + note).strip(' |')
          if not found:
              raise SystemExit('SRC-1FE2A54527 not found')
          with path.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY
          rm -f .github/workflows/fix-pinto-confirmation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize RARL catalog verification label"
          git push origin HEAD:fix/pinto-canonical-metadata
