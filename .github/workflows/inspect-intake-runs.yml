name: Inspect intake runs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false

      - name: Show selected new source metadata
        run: |
          python - <<'PY'
          import csv
          wanted={'SRC-E6A5B7584B','SRC-1FE2A54527','SRC-01BBBA7EAB','SRC-EF4972C036','SRC-FC42D9798A'}
          with open('catalog/sources.csv',encoding='utf-8',newline='') as f:
              for row in csv.DictReader(f):
                  if row.get('Κωδικός') in wanted:
                      print(row)
          PY
