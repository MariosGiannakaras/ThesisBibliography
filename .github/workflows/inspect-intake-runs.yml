name: Inspect intake runs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Create repair branch by reverting only the generated intake commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="repair/revert-generated-intake"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git revert --no-edit da92667914660d0d8a85ae4185ff6a45e785b9cc
          git push --force-with-lease origin "HEAD:$branch"
          echo "Created $branch from current main with only da926679 reverted."
