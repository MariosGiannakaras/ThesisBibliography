name: Inspect intake runs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Show post-review generated workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'THESIS_PACKAGE'
          gh run list --repo "$GITHUB_REPOSITORY" --workflow thesis-package.yml --branch main --limit 8 --json databaseId,headSha,status,conclusion,createdAt,updatedAt,url
          echo 'AGGREGATES'
          gh run list --repo "$GITHUB_REPOSITORY" --workflow aggregates.yml --branch main --limit 8 --json databaseId,headSha,status,conclusion,createdAt,updatedAt,url || true
