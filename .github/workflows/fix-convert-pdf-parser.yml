name: Apply convert PDF parser fix

on:
  push:
    branches:
      - fix/pdf-conversion-cli-parser

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-conversion-cli-parser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch parser and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("tools/convert_pdf.py")
          text = source_path.read_text(encoding="utf-8")
          old = '''def main() -> int:\n    parser = argparse.ArgumentParser()\n    parser.add_argument("--όριο", "--limit", type=int, default=0)\n    parser.add_argument("--μόνο-αναφορά", "--report-only", action="store_true")\n    parser.add_argument("--εξαναγκασμός", "--force", action="store_true")\n    parser.add_argument("--γλώσσες-ocr", "--ocr-language", default="eng+ell")\n    args = parser.parse_args()\n'''
          new = '''def build_parser() -> argparse.ArgumentParser:\n    parser = argparse.ArgumentParser()\n    parser.add_argument("--όριο", "--limit", dest="limit", type=int, default=0)\n    parser.add_argument("--μόνο-αναφορά", "--report-only", dest="report_only", action="store_true")\n    parser.add_argument("--εξαναγκασμός", "--force", dest="force", action="store_true")\n    parser.add_argument("--γλώσσες-ocr", "--ocr-language", dest="ocr_language", default="eng+ell")\n    return parser\n\n\ndef main() -> int:\n    args = build_parser().parse_args()\n'''
          if old not in text:
              if new not in text:
                  raise SystemExit("expected convert_pdf parser block not found")
          else:
              source_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_pdf_conversion.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          insertion = '''\n    def test_cli_parser_exposes_stable_english_destinations_by_default(self):\n        args = MODULE.build_parser().parse_args([])\n        self.assertEqual(0, args.limit)\n        self.assertFalse(args.report_only)\n        self.assertFalse(args.force)\n        self.assertEqual("eng+ell", args.ocr_language)\n\n    def test_cli_parser_accepts_english_aliases(self):\n        args = MODULE.build_parser().parse_args([\n            "--limit", "2", "--report-only", "--force", "--ocr-language", "eng"\n        ])\n        self.assertEqual(2, args.limit)\n        self.assertTrue(args.report_only)\n        self.assertTrue(args.force)\n        self.assertEqual("eng", args.ocr_language)\n\n    def test_cli_parser_accepts_greek_aliases_with_same_destinations(self):\n        args = MODULE.build_parser().parse_args([\n            "--όριο", "3", "--μόνο-αναφορά", "--εξαναγκασμός", "--γλώσσες-ocr", "ell"\n        ])\n        self.assertEqual(3, args.limit)\n        self.assertTrue(args.report_only)\n        self.assertTrue(args.force)\n        self.assertEqual("ell", args.ocr_language)\n'''
          if "test_cli_parser_exposes_stable_english_destinations_by_default" not in tests:
              if marker not in tests:
                  raise SystemExit("test insertion marker not found")
              test_path.write_text(tests.replace(marker, insertion + marker, 1), encoding="utf-8")
          PY
          python -m py_compile tools/convert_pdf.py
          python -m unittest tests.test_pdf_conversion -v
      - name: Commit parser fix
        run: |
          if [ -z "$(git status --porcelain tools/convert_pdf.py tests/test_pdf_conversion.py)" ]; then
            echo "Parser fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/convert_pdf.py tests/test_pdf_conversion.py
          git commit -m "fix: stabilize PDF conversion CLI parser aliases"
          git push origin HEAD:fix/pdf-conversion-cli-parser
