name: Audit bibliography intake

on:
  push:
    branches:
      - chore/bibliography-intake-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build inventory and collect group reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output/group-reports
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('.')
          output = Path('audit-output')
          source_pattern = re.compile(r'^Group\d+Files$')
          groups = []
          files = []

          for group_dir in sorted(p for p in root.iterdir() if p.is_dir() and re.fullmatch(r'Group\d+', p.name)):
              source_dirs = [p for p in group_dir.iterdir() if p.is_dir() and source_pattern.fullmatch(p.name)]
              helper_files = sorted(p for p in group_dir.iterdir() if p.is_file())
              source_files = sorted(
                  p for source_dir in source_dirs for p in source_dir.rglob('*') if p.is_file()
              )
              groups.append({
                  'group': group_dir.name,
                  'source_directories': [p.as_posix() for p in source_dirs],
                  'helper_files': [p.as_posix() for p in helper_files],
                  'source_count': len(source_files),
              })

              report_dir = output / 'group-reports' / group_dir.name
              report_dir.mkdir(parents=True, exist_ok=True)
              for helper in helper_files:
                  target = report_dir / helper.name
                  target.write_bytes(helper.read_bytes())

              for path in source_files:
                  raw = path.read_bytes()
                  try:
                      text = raw.decode('utf-8')
                  except UnicodeDecodeError:
                      text = raw.decode('utf-8', errors='replace')
                  source_match = re.search(r'^>\s*Source:\s*(\S+)', text, flags=re.MULTILINE)
                  files.append({
                      'path': path.as_posix(),
                      'group': group_dir.name,
                      'name': path.name,
                      'suffix': path.suffix.lower(),
                      'bytes': len(raw),
                      'lines': text.count('\n') + (1 if text else 0),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'source_url': source_match.group(1) if source_match else None,
                      'empty': len(raw) == 0,
                  })

          (output / 'groups.json').write_text(json.dumps(groups, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (output / 'files.json').write_text(json.dumps(files, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          with (output / 'files.csv').open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=['group', 'path', 'name', 'suffix', 'bytes', 'lines', 'sha256', 'source_url', 'empty'])
              writer.writeheader()
              writer.writerows(files)

          summary = [
              '# Bibliography intake audit',
              '',
              f'- Groups: {len(groups)}',
              f'- Source files: {len(files)}',
              f'- Empty source files: {sum(1 for item in files if item["empty"])}',
              f'- Files with a parsed source URL: {sum(1 for item in files if item["source_url"])}',
              '',
              '## Groups',
              '',
          ]
          for group in groups:
              summary.append(f'- **{group["group"]}**: {group["source_count"]} sources; helpers: {", ".join(group["helper_files"]) or "none"}')
          (output / 'SUMMARY.md').write_text('\n'.join(summary) + '\n', encoding='utf-8')
          PY

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: bibliography-intake-audit
          path: audit-output
          if-no-files-found: error
          retention-days: 7
