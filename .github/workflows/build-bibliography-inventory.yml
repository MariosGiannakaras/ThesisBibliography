name: Curate bibliography corpus

on:
  push:
    branches:
      - chore/curate-bibliography-corpus

permissions:
  contents: write

jobs:
  curate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate scripts
        run: |
          python -m py_compile scripts/build_repository_inventory.py
          python -m py_compile scripts/curate_bibliography.py

      - name: Record pre-migration inventory
        run: python scripts/build_repository_inventory.py

      - name: Normalize and index corpus
        run: python scripts/curate_bibliography.py

      - name: Commit curated corpus
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Curation produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: normalize and index bibliography corpus [skip ci]"
          git push
