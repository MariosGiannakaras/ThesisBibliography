name: Curate bibliography corpus

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate scripts
        run: |
          python -m py_compile scripts/build_repository_inventory.py
          python -m py_compile scripts/curate_bibliography.py
          python -m py_compile scripts/enrich_source_catalog.py

      - name: Record pre-migration inventory and normalize legacy groups
        run: |
          if find Group* -type f -path '*/Group*Files/*' -print -quit 2>/dev/null | grep -q .; then
            python scripts/build_repository_inventory.py
            python scripts/curate_bibliography.py
          else
            echo "Legacy grouped corpus already normalized."
          fi

      - name: Enrich scholarly metadata
        id: enrich
        continue-on-error: true
        run: |
          mkdir -p workspace
          set -o pipefail
          python scripts/enrich_source_catalog.py --online 2>&1 | tee workspace/metadata-enrichment.log

      - name: Record enrichment outcome
        if: always()
        run: printf '%s\n' '${{ steps.enrich.outcome }}' > workspace/metadata-enrichment-status.txt

      - name: Commit curated corpus and diagnostics
        if: always()
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Curation produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enrich and verify bibliography metadata [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Require successful enrichment
        if: steps.enrich.outcome != 'success'
        run: exit 1
