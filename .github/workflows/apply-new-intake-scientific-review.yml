name: Apply new intake scientific review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'analysis/new-intake-scientific-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/new-intake-scientific-review
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed decisions
        run: |
          python -m py_compile tools/apply_new_intake_review.py
          python tools/apply_new_intake_review.py
          python tools/sync_selection.py
          python tools/analysis_status.py
          python tools/export_thesis.py

      - name: Remove one-shot helper and publish review commit
        run: |
          rm -f tools/apply_new_intake_review.py .github/workflows/apply-new-intake-scientific-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: complete scientific review of new intake"
          git push origin HEAD:analysis/new-intake-scientific-review
